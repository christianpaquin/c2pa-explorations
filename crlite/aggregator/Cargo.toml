[package]
name = "ara-aggregator"
version = "0.2.0"
edition = "2021"
description = "Proof-of-concept Aggregated Revocation Artifact (ARA) aggregator for C2PA trust lists"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
coset = "0.3"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
serde_repr = "0.1"
time = { version = "0.3", features = ["formatting"] }
x509-parser = "0.16"
