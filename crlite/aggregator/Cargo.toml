[package]
name = "crlite-aggregator"
version = "0.1.0"
edition = "2021"
description = "Proof-of-concept CRLite-inspired revocation artifact aggregator for C2PA trust lists"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
x509-parser = "0.16"
